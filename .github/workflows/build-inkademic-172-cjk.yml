name: Build INKademic 1.7.2 Sticky CJK test

on:
  push:
    branches:
      - test/inkademic-1.7.2-cjk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-sticky-cjk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-platformio-py3.14-core6.1.19-inkademic-172-sticky-${{ hashFiles('platformio.ini', 'platformio.local.example.ini') }}

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Apply isolated CJK fixes
        run: python .github/scripts/inject_inkademic_172_cjk_fixes.py

      - name: Verify no Sticky PSRAM experiment is injected
        run: |
          set -euo pipefail
          ! grep -R "\[IMGPROF\]" -n lib/Epub lib/GfxRenderer
          ! grep -R "readItemContentsToStream(sourcePath, ramSink, 16384)" -n lib/Epub

      - name: Build Sticky firmware
        run: |
          set -euo pipefail
          pio run -j1 -e sticky-debug | tee pio-sticky.log
          test -f .pio/build/sticky-debug/firmware-sticky.bin
          cp .pio/build/sticky-debug/firmware-sticky.bin firmware-sticky-inkademic-1.7.2-cjk-test.bin
          sha256sum firmware-sticky-inkademic-1.7.2-cjk-test.bin | tee SHA256SUMS
          ls -lh firmware-sticky-inkademic-1.7.2-cjk-test.bin

      - name: Upload Sticky CJK test firmware
        uses: actions/upload-artifact@v7
        with:
          name: inkademic-1.7.2-sticky-cjk-test
          path: |
            firmware-sticky-inkademic-1.7.2-cjk-test.bin
            SHA256SUMS
            pio-sticky.log
          if-no-files-found: error
          retention-days: 7
